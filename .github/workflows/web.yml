# The web SDK: its tests and its build, on the Node versions apps use.
name: Web SDK

on:
  push:
    branches: [main]
    paths: ["web/**", "CONTRACT.md", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "CONTRACT.md", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The committed script-tag file matches the source
        run: git diff --exit-code -- browser/ || (echo "::error::web/browser/observa.js is out of date: run npm run build in web/ and commit it" && exit 1)
